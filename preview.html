<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Figma Preview</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 60px;
      font-family: sans-serif;
    }
    .tabs {
      display: flex; gap: 6px; background: #fff;
      border-radius: 10px; padding: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      margin-bottom: 24px;
    }
    .tab { padding: 7px 18px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; background: none; color: #757c89; font-weight: 400; transition: all .15s; }
    .tab.active { background: #2d3035; color: #fff; font-weight: 600; }
    .device {
      width: 375px; border-radius: 44px; overflow: hidden;
      box-shadow: 0 32px 72px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.06);
      background: #fff;
    }
    input::placeholder { color: #c6c9ce; }
    input { font-family: inherit; }
    button { font-family: inherit; }
    ::-webkit-scrollbar { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useCallback } = React;

    // ── Tokens
    const T = {
      primary: "#2D3035", secondary: "#757C89", tertiary: "#9CA1AA", hint: "#C6C9CE",
      border: "#E9EBEC", disable: "#DBDDE0", bgLight: "#F1F1F1",
      brand: "#FF4081", brandDeep: "#EA306F", brandBorder: "#FF5D94",
      red: "#F33F46", white: "#FFFFFF",
    };
    const F = "'Pretendard', 'Apple SD Gothic Neo', sans-serif";

    // ── Figma Assets (7일 유효)
    const A = {
      // 브랜드 필터 칩 로고 원형
      royalBase:    "https://www.figma.com/api/mcp/asset/32ea7e9d-f422-4723-8086-014fc9dad948",
      royalLogo:    "https://www.figma.com/api/mcp/asset/bf27bcc9-c21f-47ab-842e-8b2d47a753b6",
      hillsL1:      "https://www.figma.com/api/mcp/asset/97a66f6c-8441-47f9-843e-3a6c2cd011c2",
      hillsL2:      "https://www.figma.com/api/mcp/asset/d58d813c-e05c-426e-85b3-dd867285dadb",
      // 하단 선택 칩 힐스 로고
      hillsChipB:   "https://www.figma.com/api/mcp/asset/703319a5-f044-4752-aa0e-e990da2d8422",
      hillsChipL:   "https://www.figma.com/api/mcp/asset/d08e6b5e-46cb-4b69-953c-728d926052c2",
      // 상품 썸네일
      royalThumb:   "https://www.figma.com/api/mcp/asset/90a1ae87-17d3-471c-b7ee-040215413602",
      hillsThumb:   "https://www.figma.com/api/mcp/asset/63d5770f-a94c-4a75-b106-a04978f82a51",
      // 처방확인 화면
      confirmAppIcon:  "https://www.figma.com/api/mcp/asset/2b703c21-e6c5-4983-9002-ee7151aa0f03",
      confirmThumb:    "https://www.figma.com/api/mcp/asset/f0a6a26b-b28e-4d9f-9e74-6c99f0f6173f",
      confirmCoupon:   "https://www.figma.com/api/mcp/asset/616677f6-cad8-437d-88d0-b8ba7e6d2673",
      confirmDelivery: "https://www.figma.com/api/mcp/asset/6ba79ae4-83ee-412d-86fc-d9ea80fd45b9",
    };

    // ── Data
    const BRANDS = [
      { id:"royal", label:"로얄캐닌", layers:[A.royalBase, A.royalLogo] },
      { id:"hills",  label:"힐스",    layers:[A.royalBase, A.hillsL1, A.hillsL2] },
    ];
    const PET_TYPES  = ["강아지","고양이"];
    const CATEGORIES = ["요로기계","신장계","소화기계","피부/알러지","간/심장","관절","신경계","체중/당뇨","회복/기타"];
    const PRODUCTS   = [
      {id:1,name:"로얄캐닌 캣 하이포알러제닉 2.5kg",  discount:10,price:"44,700",original:"49,700원",coupon:"5,000원 쿠폰 적용됨",rating:4,reviews:213,thumb:A.hillsThumb,chipLayers:[A.royalBase,A.royalLogo]},
      {id:2,name:"힐스 캣 C/D 멀티케어 메타볼릭 1.5kg",discount:15,price:"38,200",original:"44,900원",coupon:"3,000원 쿠폰 적용됨",rating:4,reviews:87, thumb:A.hillsThumb,chipLayers:[A.hillsChipB,A.hillsChipL]},
      {id:3,name:"로얄캐닌 캣 리날 레나 고양이 2kg",   discount:10,price:"52,100",original:"57,900원",coupon:"5,000원 쿠폰 적용됨",rating:5,reviews:341,thumb:A.hillsThumb,chipLayers:[A.royalBase,A.royalLogo]},
    ];

    // ── Primitives
    function Checkbox({ checked, onChange }) {
      return (
        <div onClick={onChange} style={{ width:20,height:20,borderRadius:4,flexShrink:0,cursor:"pointer",
          border:`2px solid ${checked?T.brand:T.disable}`,backgroundColor:checked?T.brand:T.white,
          display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s" }}>
          {checked && <svg width={11} height={9} viewBox="0 0 11 9" fill="none">
            <path d="M1 4L4 7.5L10 1" stroke="#fff" strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round"/>
          </svg>}
        </div>
      );
    }

    function Stars({ n }) {
      return <div style={{display:"flex",gap:1}}>
        {[1,2,3,4,5].map(i=>(
          <svg key={i} width={11} height={11} viewBox="0 0 11 11" fill={i<=n?"#FFC700":T.border}>
            <path d="M4.95773 1.15573C5.17382 0.695767 5.82811 0.695921 6.04398 1.15599L7.06422 3.33041C7.14922 3.51156 7.31893 3.63842 7.51674 3.66866L9.84603 4.02468C10.3288 4.09847 10.5259 4.68725 10.1848 5.03679L8.46207 6.80263C8.32911 6.93891 8.26872 7.13022 8.29935 7.31814L8.70057 9.77977C8.78113 10.2741 8.25637 10.6437 7.81806 10.4014L5.79136 9.28083C5.61075 9.18097 5.3915 9.18094 5.21086 9.28075L3.1819 10.4019C2.74359 10.644 2.21898 10.2744 2.29953 9.78017L2.70082 7.31814C2.73145 7.13022 2.67106 6.93891 2.5381 6.80263L0.815323 5.03679C0.474306 4.68725 0.671407 4.09847 1.15414 4.02468L3.48361 3.66863C3.68132 3.63841 3.85097 3.51166 3.93601 3.33064L4.95773 1.15573Z"/>
          </svg>
        ))}
      </div>;
    }

    function StatusBar() {
      return (
        <div style={{height:44,backgroundColor:T.white,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",flexShrink:0}}>
          <span style={{fontWeight:700,fontSize:15,color:T.primary}}>9:41</span>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <svg width={17} height={12} viewBox="0 0 17 12" fill={T.primary}>
              <rect x="0" y="6" width="3" height="6" rx="0.5"/>
              <rect x="4" y="4" width="3" height="8" rx="0.5"/>
              <rect x="8" y="2" width="3" height="10" rx="0.5"/>
              <rect x="12" y="0" width="3" height="12" rx="0.5"/>
            </svg>
            <svg width={16} height={12} viewBox="0 0 16 12" fill="none" stroke={T.primary} strokeWidth={1.4} strokeLinecap="round">
              <path d="M1 4.5C3.8 1.8 12.2 1.8 15 4.5"/>
              <path d="M3.2 7C5.1 5.2 10.9 5.2 12.8 7"/>
              <path d="M5.5 9.5C6.5 8.6 9.5 8.6 10.5 9.5"/>
              <circle cx="8" cy="11.5" r="0.8" fill={T.primary} stroke="none"/>
            </svg>
            <svg width={25} height={12} viewBox="0 0 25 12" fill="none">
              <rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke={T.primary}/>
              <rect x="2" y="2" width="17" height="8" rx="1.5" fill={T.primary}/>
              <path d="M23 4v4" stroke={T.primary} strokeWidth={1.5} strokeLinecap="round"/>
            </svg>
          </div>
        </div>
      );
    }

    function AppBar({ scrolled, onReset }) {
      return (
        <div style={{height:52,backgroundColor:T.white,display:"flex",alignItems:"center",
          justifyContent:"space-between",padding:"0 8px",flexShrink:0,
          boxShadow:scrolled?"0 2px 8px rgba(0,0,0,.08)":"none",transition:"box-shadow .2s"}}>
          <button style={{width:40,height:40,border:"none",background:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width={24} height={24} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 12H21" stroke="#2D3035" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              <path d="M10 5L3 12L10 19" stroke="#2D3035" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
          <button onClick={onReset} style={{width:40,height:40,border:"none",background:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width={24} height={24} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M11.7892 3.20314C9.71984 3.1598 7.70576 3.87302 6.12483 5.20901C4.5439 6.545 3.50477 8.41194 3.2024 10.4596C2.90004 12.5072 3.35521 14.5948 4.48252 16.3307C5.21855 17.4641 6.20809 18.3967 7.36121 19.0625M11.7892 3.20314L9.76492 6.70934M11.7892 3.20314L7.9743 1.0006" stroke="#2D3035" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              <path d="M12.5863 20.3867C14.6556 20.43 16.6697 19.7168 18.2507 18.3808C19.8316 17.0448 20.8707 15.1779 21.1731 13.1303C21.4755 11.0826 21.0203 8.99505 19.893 7.25914C19.1569 6.12575 18.1674 5.19313 17.0143 4.52735M12.5863 20.3867L14.6106 16.8805M12.5863 20.3867L16.4012 22.5892" stroke="#2D3035" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
        </div>
      );
    }

    function InputField({ label, placeholder, value, onChange, type="text" }) {
      return (
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <span style={{fontWeight:500,fontSize:13,lineHeight:"18px",letterSpacing:"-0.26px",color:T.tertiary}}>{label}</span>
          <div style={{border:`1px solid ${value?T.primary:T.border}`,borderRadius:6,display:"flex",alignItems:"center",padding:"0 8px 0 16px",height:52,transition:"border-color .15s"}}>
            <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
              style={{flex:1,border:"none",outline:"none",background:"none",fontWeight:500,fontSize:14,letterSpacing:"-0.28px",color:T.primary,width:"100%"}}/>
            {value && (
              <button onClick={()=>onChange("")} style={{border:"none",background:"none",cursor:"pointer",padding:6,display:"flex"}}>
                <svg width={16} height={16} viewBox="0 0 16 16" fill="none">
                  <circle cx={8} cy={8} r={7} fill={T.border}/>
                  <path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke={T.secondary} strokeWidth={1.4} strokeLinecap="round"/>
                </svg>
              </button>
            )}
          </div>
        </div>
      );
    }

    function ChoiceChip({ label, selected, onClick, layers }) {
      return (
        <button onClick={onClick} style={{
          height:32,borderRadius:100,
          border:`1px solid ${selected?T.primary:T.border}`,
          backgroundColor:selected?T.primary:T.white,
          display:"inline-flex",alignItems:"center",gap:4,
          padding:layers?"4px 12px 4px 4px":"4px 12px",
          cursor:"pointer",whiteSpace:"nowrap",transition:"all .15s",
        }}>
          {layers && (
            <div style={{width:24,height:24,borderRadius:"50%",flexShrink:0,position:"relative",overflow:"hidden"}}>
              {layers.map((src,i)=>(
                <img key={i} src={src} style={{position:"absolute",top:0,left:0,width:"100%",height:"100%",objectFit:"cover"}}/>
              ))}
            </div>
          )}
          <span style={{fontWeight:400,fontSize:14,letterSpacing:"-0.28px",color:selected?"#FAFAFA":T.primary}}>{label}</span>
        </button>
      );
    }

    function CategoryGrid({ selected, onSelect }) {
      return (
        <div style={{border:`1px solid ${T.border}`,borderRadius:8,overflow:"hidden"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr"}}>
            {CATEGORIES.map((cat,i)=>{
              const sel=selected===cat, col=i%3, row=Math.floor(i/3);
              return (
                <button key={cat} onClick={()=>onSelect(sel?"":cat)} style={{
                  height:40,border:"none",backgroundColor:sel?"#FFF0F5":T.white,
                  borderRight:col<2?`1px solid ${T.border}`:"none",
                  borderBottom:row<2?`1px solid ${T.border}`:"none",
                  cursor:"pointer",fontWeight:400,fontSize:14,letterSpacing:"-0.28px",
                  color:sel?T.brand:T.secondary,transition:"all .15s",
                }}>{cat}</button>
              );
            })}
          </div>
        </div>
      );
    }

    function ProductCard({ product, checked, onToggle }) {
      return (
        <div style={{border:`1px solid ${checked?T.brand:T.bgLight}`,borderRadius:8,padding:16,
          display:"flex",gap:14,position:"relative",backgroundColor:checked?"#FFF8FB":T.white,
          transition:"all .15s"}}>
          <div style={{position:"absolute",top:16,left:16}}>
            <Checkbox checked={checked} onChange={onToggle}/>
          </div>
          {/* 상품 이미지 */}
          <div style={{marginLeft:28,width:100,height:100,borderRadius:8,backgroundColor:T.disable,flexShrink:0,position:"relative",overflow:"hidden"}}>
            {product.thumb
              ? <img src={product.thumb} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              : (product.chipLayers||[]).map((src,i)=>(
                  <img key={i} src={src} style={{position:"absolute",top:0,left:0,width:"100%",height:"100%",objectFit:"cover"}}/>
                ))
            }
          </div>
          {/* 정보 */}
          <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
            <p style={{margin:0,fontWeight:500,fontSize:13,lineHeight:"18px",letterSpacing:"-0.26px",color:T.primary}}>{product.name}</p>
            <div style={{display:"flex",gap:4,alignItems:"center",marginTop:4}}>
              <span style={{fontWeight:500,fontSize:12,letterSpacing:"-0.24px",color:T.red}}>쿠폰 적용가</span>
              <span style={{fontWeight:400,fontSize:12,color:T.tertiary,textDecoration:"line-through"}}>{product.original}</span>
            </div>
            <div style={{display:"flex",alignItems:"baseline",gap:2,marginTop:2}}>
              <span style={{fontWeight:700,fontSize:16,letterSpacing:"-0.32px",color:T.red}}>{product.discount}%</span>
              <span style={{fontWeight:700,fontSize:16,letterSpacing:"-0.32px",color:T.primary}}>{product.price}</span>
              <span style={{fontWeight:400,fontSize:14,color:T.primary}}>원</span>
            </div>
            <div style={{display:"inline-flex",alignItems:"center",gap:3,border:`1px solid ${T.brandBorder}`,borderRadius:4,padding:"2px 6px",marginTop:5,alignSelf:"flex-start",backgroundColor:T.white}}>
              <span style={{fontWeight:700,fontSize:10,letterSpacing:"-0.2px",color:T.brandDeep}}>{product.coupon}</span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:3,marginTop:5}}>
              <Stars n={product.rating}/>
              <span style={{fontWeight:400,fontSize:12,color:T.tertiary}}>({product.reviews})</span>
            </div>

    // ── Main Page
    function PrescriptionPage({ onNext }) {
      const [name, setName]     = useState("");
      const [phone, setPhone]   = useState("");
      const [search, setSearch] = useState("");
      const [brand, setBrand]   = useState(null);
      const [pet, setPet]       = useState(null);
      const [cat, setCat]       = useState("");
      const [selected, setSelected] = useState(new Set());
      const [scrolled, setScrolled] = useState(false);
      const scrollRef = useRef(null);

      const handleScroll = useCallback(()=>{
        if(scrollRef.current) setScrolled(scrollRef.current.scrollTop > 0);
      },[]);

      const toggle = id => setSelected(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
      const remove = id => setSelected(prev=>{const n=new Set(prev);n.delete(id);return n;});

      const handleReset = useCallback(()=>{
        setName(""); setPhone(""); setSearch("");
        setBrand(null); setPet(null); setCat("");
        setSelected(new Set());
        if(scrollRef.current) scrollRef.current.scrollTop = 0;
      },[]);

      const canProceed = name.trim()!=""&&phone.trim()!=""&&selected.size>0;
      const handleNext = useCallback(()=>{ if(onNext) onNext(selected); },[onNext,selected]);

      const filtered = PRODUCTS.filter(p=>{
        if(search&&!p.name.includes(search)) return false;
        return true;

      return (
        <div style={{width:375,height:812,backgroundColor:T.white,fontFamily:F,display:"flex",flexDirection:"column",overflow:"hidden"}}>

            <div style={{height:10,backgroundColor:T.bgLight,margin:"20px 0"}}/>

                {search&&<button onClick={()=>setSearch("")} style={{border:"none",background:"none",cursor:"pointer",padding:0}}>

              <div style={{display:"flex",gap:8,marginBottom:12}}>

              <div style={{height:1,backgroundColor:T.border,margin:"0 -16px 12px",width:"calc(100% + 32px)"}}/>

              {/* 반려동물 */}
              <div style={{display:"flex",gap:8,marginBottom:16}}>
                {PET_TYPES.map(t=><ChoiceChip key={t} label={t} selected={pet===t} onClick={()=>setPet(prev=>prev===t?null:t)}/>)}
              </div>

              <CategoryGrid selected={cat} onSelect={setCat}/>

              {/* 상품 */}
              <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:16}}>
                {filtered.map(p=><ProductCard key={p.id} product={p} checked={selected.has(p.id)} onToggle={()=>toggle(p.id)}/>)}

              </div>
            </section>
          </div>

          <BottomBar selectedIds={selected} onRemove={remove} ctaEnabled={canProceed} scrolled={scrolled} onNext={handleNext}/>

          </div>

          {/* Form */}
          <div style={{padding:"24px 16px",display:"flex",flexDirection:"column",gap:32,flex:1}}>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {/* 이메일 */}
              <div style={{border:`1px solid ${email?T.primary:T.border}`,borderRadius:6,display:"flex",alignItems:"center",padding:"8px 8px 8px 16px",transition:"border-color .15s"}}>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="이메일"
                  style={{flex:1,border:"none",outline:"none",background:"none",fontWeight:400,fontSize:14,lineHeight:"23px",letterSpacing:"-0.28px",color:T.primary,fontFamily:F}}/>
                {email && (
                  <button onClick={()=>setEmail("")} style={{border:"none",background:"none",cursor:"pointer",padding:6,display:"flex",flexShrink:0}}>
                    <svg width={24} height={24} viewBox="0 0 24 24" fill="none">
                      <circle cx={12} cy={12} r={10} fill={T.border}/>
                      <path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke={T.secondary} strokeWidth={1.4} strokeLinecap="round"/>
                    </svg>
                  </button>
                )}
              </div>
              {/* 비밀번호 */}
              <div style={{border:`1px solid ${password?T.primary:T.border}`,borderRadius:6,display:"flex",alignItems:"center",padding:"8px 8px 8px 16px",transition:"border-color .15s"}}>
                <input type={showPw?"text":"password"} value={password} onChange={e=>setPassword(e.target.value)} placeholder="비밀번호"
                  style={{flex:1,border:"none",outline:"none",background:"none",fontWeight:400,fontSize:14,lineHeight:"23px",letterSpacing:"-0.28px",color:T.primary,fontFamily:F}}/>
                {password && (
                  <button onClick={()=>setShowPw(p=>!p)} style={{border:"none",background:"none",cursor:"pointer",padding:6,display:"flex",flexShrink:0}}>
                    {showPw ? (
                      <svg width={24} height={24} viewBox="0 0 24 24" fill="none" stroke={T.tertiary} strokeWidth={1.5} strokeLinecap="round" strokeLinejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx={12} cy={12} r={3}/>
                      </svg>
                    ) : (
                      <svg width={24} height={24} viewBox="0 0 24 24" fill="none" stroke={T.tertiary} strokeWidth={1.5} strokeLinecap="round" strokeLinejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                        <line x1={1} y1={1} x2={23} y2={23}/>
                      </svg>
                    )}
                  </button>
                )}
              </div>
            </div>

            {/* 로그인 버튼 */}
            <button onClick={handleLogin} style={{
              width:"100%",height:48,borderRadius:6,border:"none",
              cursor:canLogin?"pointer":"default",
              backgroundColor:canLogin?T.brand:T.bgLight,
              fontWeight:700,fontSize:16,letterSpacing:"-0.32px",
              color:canLogin?T.white:T.hint,fontFamily:F,
              transition:"all .2s",
            }}>로그인</button>
          </div>

          {/* iOS home indicator */}
          <div style={{flexShrink:0,height:28,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <div style={{width:134,height:5,borderRadius:100,backgroundColor:"#000",opacity:.18}}/>
          </div>

          {/* 로딩 딤 오버레이 */}
          {loading && (
            <div style={{position:"absolute",inset:0,backgroundColor:"rgba(28,30,33,0.6)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <div style={{width:36,height:36,borderRadius:"50%",border:"3px solid rgba(255,255,255,0.25)",borderTop:"3px solid #fff",animation:"spin .7s linear infinite"}}/>
            </div>
          )}
        </div>
      );
    }

    function PrescriptionTab() {
      const [pScreen, setPScreen] = useState("prescription"); // prescription | confirm
      const [selIds, setSelIds]   = useState(new Set());
      return (
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
          <p style={{fontSize:11,color:"#999",letterSpacing:"0.5px",textTransform:"uppercase",marginBottom:4}}>
            {pScreen==="prescription"?"병원상담 신청 · 375×812 · 3-state interactive":"처방 확인 · 약관 동의"}
          </p>
          <div className="device">
            {pScreen==="prescription" && (
              <PrescriptionPage onNext={(ids)=>{ setSelIds(new Set(ids)); setPScreen("confirm"); }}/>
            )}
            {pScreen==="confirm" && (
              <ConfirmPage products={PRODUCTS.filter(p=>selIds.has(p.id))} onBack={()=>setPScreen("prescription")}/>
            )}
          </div>
          {pScreen==="confirm" && (
            <button onClick={()=>setPScreen("prescription")}
              style={{marginTop:8,fontSize:12,color:"#999",background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>
              ← 처방 화면으로
            </button>
          )}
        </div>
      );
    }

    // ── App Shell
    function App() {
      const [tab, setTab]       = useState("login");
      const [screen, setScreen] = useState("login"); // login | prescription | confirm
      const [selectedIds, setSelectedIds] = useState(new Set());

      const tabs = [["login","로그인"],["prescription","처방 화면"],["confirm","처방확인"],["dialog","Dialog"]];

      const screenLabel = {
        login: "이메일 로그인 · 375×812",
        prescription: "로그인 완료 → 처방 화면",
        confirm: "처방 확인 · 약관 동의",
      }[screen] || "";

      const handleNext = (ids) => { setSelectedIds(new Set(ids)); setScreen("confirm"); };

      return (
        <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
          <div className="tabs">
            {tabs.map(([k,l])=>(
              <button key={k} className={`tab${tab===k?" active":""}`} onClick={()=>setTab(k)}>{l}</button>
            ))}
          </div>

          {tab==="login" && (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
              <p style={{fontSize:11,color:"#999",letterSpacing:"0.5px",textTransform:"uppercase",marginBottom:4}}>
                {screenLabel}
              </p>
              <div className="device">
                {screen==="login"        && <LoginPage onLogin={()=>setScreen("prescription")}/>}
                {screen==="prescription" && <PrescriptionPage onNext={handleNext}/>}
                {screen==="confirm"      && <ConfirmPage products={PRODUCTS.filter(p=>selectedIds.has(p.id))} onBack={()=>setScreen("prescription")}/>}
              </div>
              {screen!=="login" && (
                <button onClick={()=>setScreen("login")}
                  style={{marginTop:8,fontSize:12,color:"#999",background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>
                  ← 로그인 화면으로
                </button>
              )}
            </div>
          )}

          {tab==="prescription" && (
            <PrescriptionTab/>
          )}

          {tab==="confirm" && (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
              <p style={{fontSize:11,color:"#999",letterSpacing:"0.5px",textTransform:"uppercase",marginBottom:4}}>
                처방확인 · 375×812 · 약관 동의
              </p>
              <div className="device"><ConfirmPage products={PRODUCTS.slice(0,2)}/></div>
              <p style={{fontSize:11,color:"#aaa",marginTop:8,textAlign:"center",lineHeight:1.6}}>
                모든 약관 동의 → 카카오톡 안내 CTA 활성화<br/>
                화살표 클릭 → 약관 펼치기/접기
              </p>
            </div>
          )}

          {tab==="dialog" && (
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:24}}>
              <p style={{fontSize:11,color:"#999",letterSpacing:"0.5px",textTransform:"uppercase"}}>Dialog · node 1461:24655</p>
              <div style={{background:T.white,borderRadius:10,overflow:"hidden",boxShadow:"0 4px 24px rgba(0,0,0,.1)"}}><Dialog/></div>
              <div style={{background:T.white,borderRadius:10,overflow:"hidden",boxShadow:"0 4px 24px rgba(0,0,0,.1)"}}><Dialog title="정말 삭제하시겠습니까?" description="삭제된 항목은 복구할 수 없습니다." a1="취소" a2="삭제"/></div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
